
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}PokeOrigins{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='image/icons/logo.png') }}">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
            width: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            color: white;

            background-image:
                linear-gradient(rgba(0, 10, 35, 0.55), rgba(0, 10, 35, 0.75)),
                url("/static/image/icons/fond%20home.png");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        body.fond-wiki {
            background-image:
                linear-gradient(rgba(3, 12, 30, 0.25), rgba(3, 12, 30, 0.25)),
                url("/static/image/icons/fond%20home.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* =====================================
           HEADER
        ===================================== */

        .site-header {
            height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 100;
            background: rgba(2, 15, 45, 0.92);
            border-bottom: 2px solid #159dff;
            flex-shrink: 0;
        }

        .site-logo {
            color: #45eaff;
            font-size: 32px;
            font-weight: bold;
            text-decoration: none;
        }

        .menu-button {
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border: 1px solid #21baff;
            border-radius: 12px;
            background: rgba(0, 100, 220, 0.2);
            color: white;
            font-size: 27px;
            cursor: pointer;
        }

        .menu-button:hover {
            background: rgba(0, 145, 255, 0.4);
        }

        /* =====================================
           COMPTE GOOGLE
        ===================================== */

        .account-area {
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .account-button {
            padding: 12px 18px;
            border: 1px solid #21baff;
            border-radius: 10px;
            background: rgba(0, 100, 220, 0.2);
            color: #bceaff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }

        .account-button:hover {
            background: rgba(0, 145, 255, 0.4);
            color: white;
            box-shadow: 0 0 15px rgba(0, 160, 255, 0.35);
        }

        .account-user {
            display: none;
            align-items: center;
            gap: 10px;
        }

        .account-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #45eaff;
        }

        .account-logout {
            padding: 9px 12px;
            border: 1px solid rgba(255, 100, 100, 0.5);
            border-radius: 8px;
            background: rgba(180, 30, 30, 0.2);
            color: #ffbaba;
            cursor: pointer;
        }

        .account-logout:hover {
            background: rgba(220, 40, 40, 0.4);
        }

        /* =====================================
           MENU LATÉRAL
        ===================================== */

        .menu-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, 0.65);
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: -320px;
            width: 290px;
            height: 100vh;
            padding: 30px 20px;
            z-index: 201;
            background: rgba(3, 20, 55, 0.98);
            border-right: 2px solid #159dff;
            transition: left 0.3s ease;
            overflow-y: auto;
        }

        .side-menu.active {
            left: 0;
        }

        .menu-title {
            color: #45eaff;
            font-size: 25px;
            margin-bottom: 30px;
            text-align: center;
        }

        .menu-close {
            position: absolute;
            top: 18px;
            right: 18px;
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }

        .side-menu a {
            display: block;
            padding: 15px;
            margin-bottom: 10px;
            color: white;
            text-decoration: none;
            background: rgba(0, 110, 220, 0.13);
            border: 1px solid rgba(40, 165, 255, 0.3);
            border-radius: 10px;
            transition: 0.2s;
        }

        .side-menu a:hover {
            color: #45eaff;
            background: rgba(0, 150, 255, 0.3);
            border-color: #45eaff;
        }

        /* =====================================
           CONTENU
        ===================================== */

        .page-content {
            flex: 1 0 auto;
            width: 100%;
        }

        /* =====================================
           PIED DE PAGE
        ===================================== */

        .site-footer {
            width: 100%;
            margin-top: auto;
            padding: 18px 20px;
            text-align: center;
            color: rgba(210, 230, 255, 0.65);
            font-size: 13px;
            background: rgba(2, 15, 45, 0.85);
            border-top: 1px solid rgba(50, 190, 255, 0.25);
            flex-shrink: 0;
        }

        .site-footer span {
            color: #45eaff;
            font-weight: bold;
        }

        /* =====================================
           RESPONSIVE
        ===================================== */

        @media (max-width: 600px) {

            .site-header {
                height: 70px;
            }

            .site-logo {
                font-size: 22px;
            }

            .menu-button {
                left: 10px;
                width: 40px;
                height: 40px;
                font-size: 23px;
            }

            .account-area {
                right: 10px;
            }

            .account-button {
                padding: 10px;
                font-size: 11px;
            }

            .account-avatar {
                width: 32px;
                height: 32px;
            }

            .account-logout {
                padding: 8px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body class="{% if request.path.startswith('/wiki') %}fond-wiki{% endif %}">

    <!-- =====================================
         HEADER
    ===================================== -->

    <header class="site-header">

        <button
            class="menu-button"
            onclick="toggleMenu()"
            aria-label="Ouvrir le menu"
            aria-expanded="false"
            id="menuButton"
        >☰</button>

        <a href="/" class="site-logo">⚡ PokeOrigins</a>

        <!-- COMPTE GOOGLE -->

        <div class="account-area">

            <button
                class="account-button"
                id="googleLoginButton"
                onclick="connexionGoogle()"
            >
                🔐 Se connecter avec Google
            </button>

            <div class="account-user" id="accountUser">

                <img
                    src="/static/image/icons/logo.png"
                    alt="Avatar"
                    class="account-avatar"
                    id="accountAvatar"
                >

                <a href="/compte" class="account-button">
                    👤 Mon compte
                </a>

                <button
                    class="account-logout"
                    onclick="deconnexionGoogle()"
                >
                    Déconnexion
                </button>

            </div>

        </div>

    </header>

    <!-- =====================================
         MENU
    ===================================== -->

    <div
        class="menu-overlay"
        id="menuOverlay"
        onclick="toggleMenu()"
    ></div>

    <nav class="side-menu" id="sideMenu" aria-label="Navigation principale">

        <button
            class="menu-close"
            onclick="toggleMenu()"
            aria-label="Fermer le menu"
        >×</button>

        <div class="menu-title">⚡ PokeOrigins</div>

        <a href="/">🏠 Accueil</a>
        <a href="/presentation">🌍 Présentation</a>
        <a href="/wiki">📘 Wiki</a>
        <a href="/joueur">👤 Joueur</a>
        <a href="/vote">🗳️ Vote</a>
        <a href="/boutique">🛒 Boutique</a>
        <a href="/actualites">📰 Actualités</a>
        <a href="/classements">🏆 Classements</a>
        <a href="/discord">💬 Discord</a>

    </nav>

    <!-- =====================================
         CONTENU DES PAGES
    ===================================== -->

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>

    <!-- =====================================
         COPYRIGHT
    ===================================== -->

    <footer class="site-footer">
        © 2026 <span>PokeOrigins</span> — Tous droits réservés.
    </footer>

    <!-- =====================================
         BIBLIOTHÈQUE SUPABASE
    ===================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- =====================================
         JAVASCRIPT
    ===================================== -->

    <script>

        // =====================================
        // MENU
        // =====================================

        function toggleMenu() {

            const menu = document.getElementById("sideMenu");
            const overlay = document.getElementById("menuOverlay");
            const button = document.getElementById("menuButton");

            menu.classList.toggle("active");
            overlay.classList.toggle("active");

            button.setAttribute(
                "aria-expanded",
                menu.classList.contains("active")
            );
        }

        function closeMenu() {

            document.getElementById("sideMenu").classList.remove("active");
            document.getElementById("menuOverlay").classList.remove("active");

            document.getElementById("menuButton").setAttribute(
                "aria-expanded",
                "false"
            );
        }


        // =====================================
        // CONFIGURATION SUPABASE
        // =====================================

        window.supabaseClient = window.supabase.createClient(
        {{ supabase_url | tojson }},
        {{ supabase_key | tojson }}
        );

        // =====================================
        // AFFICHAGE DU COMPTE
        // =====================================

        function afficherCompte(utilisateur) {

            const boutonConnexion =
                document.getElementById("googleLoginButton");

            const compte =
                document.getElementById("accountUser");

            if (!utilisateur) {

                boutonConnexion.style.display = "block";
                compte.style.display = "none";

                return;
            }

            boutonConnexion.style.display = "none";
            compte.style.display = "flex";

            const metadata = utilisateur.user_metadata || {};

            const avatar =
                metadata.avatar_url ||
                metadata.picture ||
                "/static/image/icons/logo.png";

            document.getElementById("accountAvatar").src = avatar;
        }


        // =====================================
        // SYNCHRONISATION AVEC FLASK
        // =====================================

        async function actualiserCompte(session) {

            if (!session) {

                afficherCompte(null);

                await fetch("/auth/logout", {
                    method: "POST"
                });

                return;
            }

            const reponse = await fetch("/auth/session", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    access_token: session.access_token
                })

            });

            if (!reponse.ok) {

                afficherCompte(null);

                console.error(
                    "Impossible de synchroniser le compte."
                );

                return;
            }

            afficherCompte(session.user);
        }


        // =====================================
        // CONNEXION GOOGLE
        // =====================================

        async function connexionGoogle() {

            const bouton =
                document.getElementById("googleLoginButton");

            bouton.disabled = true;
            bouton.textContent = "Connexion en cours...";

            const { error } =
                await window.supabaseClient.auth.signInWithOAuth({

                    provider: "google",

                    options: {
                        redirectTo: window.location.origin
                    }

                });

            if (error) {

                console.error(error);

                alert(
                    "Impossible de se connecter avec Google."
                );

                bouton.disabled = false;
                bouton.textContent =
                    "🔐 Se connecter avec Google";
            }
        }


        // =====================================
        // DÉCONNEXION
        // =====================================

        async function deconnexionGoogle() {

            await fetch("/auth/logout", {
                method: "POST"
            });

            const { error } =
                await window.supabaseClient.auth.signOut();

            if (error) {

                console.error(error);

                alert(
                    "La déconnexion a rencontré un problème."
                );

                return;
            }

            afficherCompte(null);

            window.location.href = "/";
        }


        // =====================================
        // INITIALISATION DU COMPTE
        // =====================================

        async function initialiserCompte() {

            const { data, error } =
                await window.supabaseClient.auth.getSession();

            if (error) {

                console.error(error);
                afficherCompte(null);

                return;
            }

            await actualiserCompte(data.session);
        }


        // =====================================
        // ÉCOUTE DES CHANGEMENTS DE CONNEXION
        // =====================================

        window.supabaseClient.auth.onAuthStateChange(
            (event, session) => {

                if (
                    event === "SIGNED_IN" ||
                    event === "TOKEN_REFRESHED" ||
                    event === "SIGNED_OUT"
                ) {

                    setTimeout(() => {
                        actualiserCompte(session);
                    }, 0);

                }

            }
        );


        // =====================================
        // LANCEMENT
        // =====================================

        initialiserCompte();


        // =====================================
        // FERMETURE AVEC ÉCHAP
        // =====================================

        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {
                closeMenu();
            }

        });

    </script>

</body>
</html>
